[package]
name = "blackjack-rs"
version = "0.4.0"
edition = "2024"
description = "A simple blackjack libary + CLI implementation"
repository = "https://github.com/the-penwing/blackjack-rs"
license = "AGPL-3.0-only"
keywords = ["blackjack", "cli", "game", "libary"]

[dependencies]
clearscreen = "4.0.*"
rand = "0.10.*"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
codegen-units = 1
